name: 发布乐学

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: 设置 pnpm
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装音频检查工具
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 测试并构建
        run: |
          pnpm test
          pnpm build

      - name: 计算镜像名称
        id: image
        shell: bash
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: 登录 GitHub 容器仓库
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: 构建并推送不可变版本镜像
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --pull --file deploy/Dockerfile.runtime --tag "$repository:$GITHUB_REF_NAME" --tag "$repository:latest" .
          docker push "$repository:$GITHUB_REF_NAME"
          docker push "$repository:latest"

      - name: 打包生产部署镜像
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          archive="lexue-image-${GITHUB_REF_NAME}.tar.gz"
          docker save "$repository:$GITHUB_REF_NAME" | gzip -1 > "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: 暂存生产部署镜像
        uses: actions/upload-artifact@v4
        with:
          name: production-image-${{ github.ref_name }}
          path: |
            lexue-image-${{ github.ref_name }}.tar.gz
            lexue-image-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 生成静态部署包
        shell: bash
        run: |
          mkdir -p release
          archive="release/lexue-pwa-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -qr "../$archive" .)
          sha256sum "$archive" > "$archive.sha256"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag

  deploy-aliyun:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 检出部署脚本
        uses: actions/checkout@v6

      - name: 下载生产部署镜像
        uses: actions/download-artifact@v4
        with:
          name: production-image-${{ github.ref_name }}
          path: deploy-image

      - name: 校验部署参数
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          ALIYUN_SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$ALIYUN_HOST"
          test -n "$ALIYUN_USER"
          test -n "$ALIYUN_SSH_PRIVATE_KEY"
          test -n "$ALIYUN_SSH_KNOWN_HOSTS"

      - name: 准备 SSH
        env:
          ALIYUN_SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          ALIYUN_SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_PRIVATE_KEY" > ~/.ssh/aliyun_deploy
          chmod 600 ~/.ssh/aliyun_deploy
          printf '%s\n' "$ALIYUN_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 上传并执行部署
        shell: bash
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
          ALIYUN_DEPLOY_PATH: ${{ secrets.ALIYUN_DEPLOY_PATH }}
          ALIYUN_APP_PORT: ${{ secrets.ALIYUN_APP_PORT }}
          LEXUE_IMAGE: ${{ needs.build-and-publish.outputs.image }}
        run: |
          ssh_port="${ALIYUN_SSH_PORT:-22}"
          deploy_path="${ALIYUN_DEPLOY_PATH:-lexue}"
          app_port="${ALIYUN_APP_PORT:-8080}"
          ssh_target="$ALIYUN_USER@$ALIYUN_HOST"
          ssh_args=(-i ~/.ssh/aliyun_deploy -p "$ssh_port" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          [[ "$deploy_path" =~ ^[A-Za-z0-9_./-]+$ ]] && [[ "$deploy_path" != *".."* ]]
          image_archive="lexue-image-${GITHUB_REF_NAME}.tar.gz"
          ssh "${ssh_args[@]}" "$ssh_target" "mkdir -p '$deploy_path'"
          scp -i ~/.ssh/aliyun_deploy -P "$ssh_port" -o BatchMode=yes -o StrictHostKeyChecking=yes -o Compression=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            deploy/compose.yaml deploy/remote-deploy.sh \
            "deploy-image/$image_archive" "deploy-image/$image_archive.sha256" \
            "$ssh_target:$deploy_path/"
          ssh "${ssh_args[@]}" "$ssh_target" \
            "cd '$deploy_path' && chmod 700 remote-deploy.sh && LEXUE_IMAGE='$LEXUE_IMAGE' LEXUE_IMAGE_ARCHIVE='$image_archive' LEXUE_PORT='$app_port' ./remote-deploy.sh"
