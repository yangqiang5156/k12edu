services:
  postgres:
    image: postgres:17-alpine
    container_name: lexue-postgres
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexue}
      POSTGRES_USER: ${POSTGRES_USER:-lexue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexue} -d ${POSTGRES_DB:-lexue}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lexue]

  lexue:
    image: ${LEXUE_IMAGE:?请设置 LEXUE_IMAGE}
    container_name: lexue
    command: ["node", "--env-file=/app/.env", "server/index.mjs"]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 80
      # 也覆盖旧镜像内置默认值，回滚时仍以同一个.env为准。
      TTS_CACHE_DIR: ${TTS_CACHE_DIR:-/app/data/tts-cache}
    ports:
      - "127.0.0.1:${LEXUE_PORT:-8080}:80"
    volumes:
      - ./data:/app/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks: [lexue]

networks:
  lexue:
