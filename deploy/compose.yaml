services:
  lexue:
    image: ${LEXUE_IMAGE:?请设置 LEXUE_IMAGE}
    container_name: lexue
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LEXUE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
