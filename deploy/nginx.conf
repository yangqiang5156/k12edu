server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # 入口、清单和 Service Worker 每次都向服务器确认，避免旧版本长期驻留。
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Service-Worker-Allowed "/" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
  }

  # Vite 产物文件名包含内容哈希，可以安全长期缓存。
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # 音频和固定名称图标可能随版本变化，始终重新验证。
  location ~* \.(?:mp3|png|svg|json)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
