services:
  postgres:
    image: postgres:17-alpine
    container_name: lexue-postgres
    restart: unless-stopped
    env_file:
      - path: .env.postgres
        required: true
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexue -d lexue"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lexue-production

networks:
  lexue-production:
    external: true
    name: lexue_default
